<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Smiski Bit Older — Happy Birthday Biggie!</title>
<style>
  :root{
    --page-ratio: 1587 / 2245;
    --spread-ratio: 3174 / 2245;
    --kraft-1: #cfa06a;
    --kraft-2: #b9854d;
    --ink: #4a3420;
    --paper-shadow: 0 18px 45px rgba(45, 28, 8, 0.45), 0 4px 10px rgba(45,28,8,0.3);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
    background: var(--kraft-1);
  }

  /* ---------- kraft paper background ---------- */
  #stage{
    position: fixed; inset: 0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top: clamp(28px, 6vh, 90px);
    padding-bottom: 24px;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.10), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(0,0,0,0.12), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, var(--kraft-1), var(--kraft-2));
    overflow: hidden;
  }
  #grain{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode: multiply; opacity:0.35;
  }

  .scene{
    position: relative;
    width: 100%;
    height: 100%;
  }
  .anchor{
    position:absolute;
    left:50%;
    top:0;
    transform: translateX(-50%);
    pointer-events:none;
  }

  /* ---------- shared page chrome ---------- */
  .paper{
    background: #fff;
    box-shadow: var(--paper-shadow);
    border-radius: 6px;
  }

  /* ---------- COVER ---------- */
  #coverWrap{
    position:relative;
    height: min(82vh, 82vw / (1587/2245));
    aspect-ratio: var(--page-ratio);
    cursor: pointer;
    pointer-events: auto;
    transition: opacity .5s ease, transform .6s cubic-bezier(.55,.05,.45,1);
    transform-style: preserve-3d;
    transform-origin: left center;
  }
  #coverWrap img{
    width:100%; height:100%; object-fit:cover; border-radius:6px; display:block;
  }
  #coverWrap .paper{ width:100%; height:100%; }
  #coverWrap .hint{
    position:absolute; left:50%; bottom:-42px; transform:translateX(-50%);
    color:#fff5da; font-size: 14px; letter-spacing:.02em; opacity:.85;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
    white-space:nowrap;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.55} 50%{opacity:1} }

  body.open #coverWrap{
    transform: rotateY(-140deg) translateX(-2%);
    opacity: 0;
    pointer-events:none;
  }

  /* ---------- SPREAD ---------- */
  #spreadWrap{
    position:relative;
    height: min(82vh, 82vw / (3174/2245));
    aspect-ratio: var(--spread-ratio);
    display:flex;
    opacity:0;
    transform: scale(.92);
    pointer-events:none;
    transition: opacity .55s ease .15s, transform .6s cubic-bezier(.2,.8,.3,1) .15s;
  }
  body.open #spreadWrap{
    opacity:1;
    transform: scale(1);
    pointer-events:auto;
  }

  .page{
    position:relative;
    width:50%;
    height:100%;
    overflow:hidden;
  }
  .page.left{ border-radius: 6px 0 0 6px; box-shadow: var(--paper-shadow); }
  .page.right{ border-radius: 0 6px 6px 0; box-shadow: var(--paper-shadow); }
  .spine{
    position:absolute; top:0; bottom:0; left:50%; width:14px; margin-left:-7px;
    background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,0) 35%, rgba(0,0,0,0) 65%, rgba(0,0,0,.22));
    z-index: 30; pointer-events:none;
  }

  .page-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- LETTER PAGE ---------- */
  .peek-hotspot{
    position:absolute;
    left: 18%; top: 56%; width: 64%; height: 30%;
    cursor:pointer;
    z-index: 5;
  }
  .letter-pull{
    position:absolute;
    left:50%; top: 66%;
    width: 80%;
    transform: translate(-50%, 0) scale(.42);
    transform-origin: 50% 85%;
    opacity: 0;
    border-radius: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0);
    cursor: pointer;
    transition: transform .55s cubic-bezier(.22,.85,.32,1.15), opacity .4s ease, top .55s cubic-bezier(.22,.85,.32,1), box-shadow .5s ease;
    z-index: 6;
  }
  .letter-pull img{ width:100%; display:block; border-radius:4px; }

  .letter-pull.open{
    top: 50%;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    box-shadow: 0 22px 50px rgba(20,10,0,.45);
    z-index: 20;
  }
  .letter-page-frame{
    position:absolute; inset: 6%;
    pointer-events:none;
  }

  /* ---------- CANDLES PAGE ---------- */
  .flame{
    position:absolute;
    transform-origin: 50% 92%;
    filter: drop-shadow(0 4px 6px rgba(120,60,0,.35));
    will-change: transform;
  }
  .flame img{ width:100%; display:block; }
  #flameL{ left:29.30%; top:34.30%; width:9.26%; height:10.60%; }
  #flameM{ left:42.91%; top:30.56%; width:9.26%; height:11.18%; }
  #flameR{ left:59.36%; top:32.38%; width:9.20%; height:10.60%; }

  @keyframes idleFlicker{
    0%,100%{ transform: rotate(-1.5deg) scaleY(1); }
    25%{ transform: rotate(1.5deg) scaleY(1.02); }
    50%{ transform: rotate(-0.8deg) scaleY(0.98); }
    75%{ transform: rotate(1deg) scaleY(1.01); }
  }
  .flame.lit{ animation: idleFlicker 2.6s ease-in-out infinite; }
  #flameM.lit{ animation-duration: 3.1s; }
  #flameR.lit{ animation-duration: 2.3s; }

  .flame.out{ opacity:0; transform: rotate(0) scale(.3); transition: opacity .35s ease, transform .35s ease; }

  .smoke{
    position:absolute; left:50%; top:0; width: 40%; height:0; opacity:0;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,180,180,.55), rgba(180,180,180,0) 70%);
    pointer-events:none;
  }
  .smoke.show{
    animation: smokeUp 1.4s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{ opacity:.55; height:6%; transform: translate(-50%,0) scaleX(1); }
    100%{ opacity:0; height:60%; transform: translate(-50%,-90%) scaleX(2.2); }
  }

  .mic-meter{
    position:absolute; left: 6%; bottom: 5.5%; width: 42%;
    display:flex; align-items:center; gap:8px;
    z-index: 15;
  }
  .mic-meter .icon{ font-size: 18px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .meter-track{
    flex:1; height:10px; border-radius:6px;
    background: rgba(255,255,255,.35);
    border: 1px solid rgba(0,0,0,.15);
    overflow:hidden;
  }
  .meter-fill{
    height:100%; width:0%;
    background: linear-gradient(90deg,#ffd76a,#ff9a3c,#ff5b4d);
    transition: width .06s linear;
  }
  .mic-note{
    position:absolute; left:6%; bottom: 2%; width: 88%;
    font-size: 11.5px; line-height:1.35; color:#3a2a12;
    background: rgba(255,255,255,.55); border-radius:6px; padding:4px 8px;
    z-index: 15;
  }

  .blow-fallback{
    position:absolute; right: 6%; bottom: 5.5%;
    z-index: 15;
    background: #fff8e8; border: 2px solid #4a3420; color:#4a3420;
    font-weight:600; font-size: 13px;
    padding: 9px 14px; border-radius: 999px;
    cursor:pointer; user-select:none;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    transition: transform .15s ease, background .15s ease;
  }
  .blow-fallback:active, .blow-fallback.holding{
    transform: scale(.94);
    background: #ffe9b8;
  }

  .wish-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    text-align:center;
    opacity:0; pointer-events:none;
    transition: opacity .5s ease;
    z-index: 25;
  }
  .wish-overlay.show{ opacity:1; pointer-events:auto; }
  .wish-card{
    background: rgba(255,251,240,.94);
    border-radius: 14px;
    padding: 22px 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
    max-width: 82%;
  }
  .wish-card h2{
    margin: 0 0 6px 0;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(18px, 3.4vw, 26px);
    color:#5a3d17;
  }
  .wish-card p{ margin:0; font-size: 13px; color:#7a5c33; }
  .relight-btn{
    margin-top: 12px;
    background:#4a7c3f; color:#fff; border:none;
    padding: 9px 18px; border-radius: 999px; font-size:13px; font-weight:600;
    cursor:pointer;
  }

  canvas#confetti{
    position:absolute; inset:0; pointer-events:none; z-index: 24;
  }

  .back-btn{
    position:absolute; top: -46px; left: 0;
    background: rgba(255,251,240,.92); color:#4a3420;
    border: 1px solid rgba(0,0,0,.15);
    font-size: 13px; font-weight:600;
    padding: 8px 14px; border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    opacity:0; pointer-events:none;
    transition: opacity .4s ease .2s, transform .2s ease;
  }
  body.open .back-btn{ opacity:1; pointer-events:auto; }
  .back-btn:active{ transform: scale(.95); }

  @media (max-width: 720px){
    #stage{ padding-top: clamp(18px, 5vh, 50px); }
    #spreadWrap{
      height: auto;
      width: min(94vw, 82vh / (1587/2245) * 2 * 0.72);
    }
    .mic-note{ font-size: 10px; }
    .back-btn{ top: -40px; font-size: 12px; padding: 7px 12px; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);
  }
</style>
</head>

        <div class="mic-meter">
          <span class="icon">🎙️</span>
          <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
        </div>
        <div class="mic-note" id="micNote">Blow into your mic to blow out the candles. Mic access needs https hosting — if it's blocked, hold the button (or spacebar) to blow instead.</div>

        <button class="blow-fallback" id="blowBtn">hold to blow</button>

        <canvas id="confetti"></canvas>

        <div class="wish-overlay" id="wishOverlay">
          <div class="wish-card">
            <h2 id="wishText">make a wish, Darren</h2>
            <p>close your eyes for a sec ✨</p>
            <button class="relight-btn" id="relightBtn">relight candles</button>

</div>

<script>
(function(){
  "use strict";

  var NAME = "Darren"; // change this to personalize "make a wish, ___"
  document.getElementById('wishText').textContent = 'make a wish, ' + NAME;

  var body = document.body;
  var coverWrap = document.getElementById('coverWrap');
  var backBtn = document.getElementById('backBtn');
  var peekHotspot = document.getElementById('peekHotspot');
  var letterPull = document.getElementById('letterPull');

  function openCard(){
    body.classList.add('open');
  }
  function closeCard(){
    body.classList.remove('open');
    letterPull.classList.remove('open');
    resetCandles();
  }

  coverWrap.addEventListener('click', openCard);
  coverWrap.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCard(); }
  });
  backBtn.addEventListener('click', closeCard);

  function toggleLetter(){
    letterPull.classList.toggle('open');
  }
  peekHotspot.addEventListener('click', function(e){
    if(!letterPull.classList.contains('open')){ toggleLetter(); }
  });
  letterPull.addEventListener('click', function(e){
    e.stopPropagation();
    toggleLetter();
  });

  /* ===================== CANDLES ===================== */
  var flames = [
    document.getElementById('flameL'),
    document.getElementById('flameM'),
    document.getElementById('flameR')
  ];
  var meterFill = document.getElementById('meterFill');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');
  var blowBtn = document.getElementById('blowBtn');
  var micNote = document.getElementById('micNote');

  var candlesLit = true;
  var blowStart = null;
  var BLOW_HOLD_MS = 500;
  var extinguished = false;

  function setFlameBend(level){
    // level 0..1
    flames.forEach(function(f, i){
      var dir = (i % 2 === 0) ? 1 : -1;
      var deg = dir * (10 + level * 55);
      var squish = 1 - level * 0.35;
      f.style.transform = 'rotate(' + deg + 'deg) scaleY(' + squish + ')';
    });
  }
  function clearFlameBend(){
    flames.forEach(function(f){ f.style.transform = ''; });
  }

  function setMeter(level){
    meterFill.style.width = Math.round(Math.min(1,Math.max(0,level)) * 100) + '%';
  }

  function extinguishCandles(){
    if(extinguished) return;
    extinguished = true;
    candlesLit = false;
    flames.forEach(function(f){
      f.classList.remove('lit');
      f.style.transform = '';
      f.classList.add('out');
      var smoke = f.querySelector('.smoke');
      if(smoke){ smoke.classList.add('show'); }
    });
    setTimeout(function(){
      wishOverlay.classList.add('show');
      launchConfetti();
    }, 350);
  }

  function resetCandles(){
    extinguished = false;
    candlesLit = true;
    blowStart = null;
    wishOverlay.classList.remove('show');
    flames.forEach(function(f){
      f.classList.remove('out');
      f.classList.add('lit');
      f.style.transform = '';
      var smoke = f.querySelector('.smoke');
      if(smoke){ smoke.classList.remove('show'); }
    });
    setMeter(0);
  }
  relightBtn.addEventListener('click', resetCandles);

  var BLOW_THRESHOLD = 0.16; // rms level 0..1 that counts as "blowing"

  function handleLevel(level){
    setMeter(level);
    if(!candlesLit || extinguished) return;
    if(level >= BLOW_THRESHOLD){
      setFlameBend(Math.min(1, (level - BLOW_THRESHOLD) / (1 - BLOW_THRESHOLD) + 0.35));
      if(blowStart === null) blowStart = performance.now();
      if(performance.now() - blowStart >= BLOW_HOLD_MS){
        extinguishCandles();
      }
    } else {
      blowStart = null;
      clearFlameBend();
    }
  }

  /* ---------- mic blow detection ---------- */
  var audioCtx = null, analyser = null, micData = null, micRAF = null, micStream = null;

  function startMic(){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      micNote.textContent = "Mic isn't available in this browser/context. Use the hold-to-blow button or spacebar below.";
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
      .then(function(stream){
        micStream = stream;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.6;
        micData = new Uint8Array(analyser.fftSize);
        source.connect(analyser);
        micNote.textContent = "Listening — blow steadily into your mic 🎂";
        micLoop();
      })
      .catch(function(err){
        micNote.textContent = "Mic blocked (" + (err && err.name ? err.name : 'error') + "). Use the hold-to-blow button or hold spacebar instead. Note: mic access needs the page hosted over https, not opened as a local file.";
      });
  }

  function micLoop(){
    micRAF = requestAnimationFrame(micLoop);
    if(!analyser) return;
    analyser.getByteTimeDomainData(micData);
    var sum = 0;
    for(var i=0;i<micData.length;i++){
      var v = (micData[i]-128)/128;
      sum += v*v;
    }
    var rms = Math.sqrt(sum/micData.length); // roughly 0..~0.6 for loud blow
    var level = Math.min(1, rms * 3.2);
    if(!isFallbackHolding){
      handleLevel(level);
    }
  }

  // Try starting mic automatically on first user gesture (opening the card)
  var micStarted = false;
  function ensureMicStarted(){
    if(micStarted) return;
    micStarted = true;
    startMic();
  }
  coverWrap.addEventListener('click', ensureMicStarted);

  /* ---------- fallback: hold button / spacebar ---------- */
  var isFallbackHolding = false;
  var fallbackRAF = null;
  var fallbackLevel = 0;

  function fallbackLoop(){
    fallbackRAF = requestAnimationFrame(fallbackLoop);
    if(isFallbackHolding){
      fallbackLevel = Math.min(1, fallbackLevel + 0.045);
    } else {
      fallbackLevel = Math.max(0, fallbackLevel - 0.08);
    }
    handleLevel(fallbackLevel);
  }
  fallbackLoop();

  function startFallback(){
    if(isFallbackHolding) return;
    isFallbackHolding = true;
    blowBtn.classList.add('holding');
    blowBtn.textContent = 'blowing…';
  }
  function stopFallback(){
    isFallbackHolding = false;
    blowStart = null;
    blowBtn.classList.remove('holding');
    blowBtn.textContent = 'hold to blow';
  }

  blowBtn.addEventListener('mousedown', startFallback);
  blowBtn.addEventListener('touchstart', function(e){ e.preventDefault(); startFallback(); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
    blowBtn.addEventListener(ev, stopFallback);
  });

  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && body.classList.contains('open')){
      e.preventDefault();
      startFallback();
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space'){ stopFallback(); }
  });

  /* ---------- confetti ---------- */
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var confettiPieces = [];
  var confettiRAF = null;
  var confettiColors = ['#ff5b4d','#ffd76a','#4a7c3f','#8fd3a1','#ff9a3c','#f7f3e8'];

  function resizeCanvas(){
    var rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);

  function launchConfetti(){
    resizeCanvas();
    confettiPieces = [];
    var n = 90;
    for(var i=0;i<n;i++){
      confettiPieces.push({
        x: canvas.width/2 + (Math.random()-0.5)*canvas.width*0.5,
        y: canvas.height*0.35 + (Math.random()-0.5)*40,
        vx: (Math.random()-0.5)*6,
        vy: -(Math.random()*6+4),
        g: 0.18 + Math.random()*0.08,
        size: 5+Math.random()*6,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 130 + Math.random()*60
      });
    }
    if(confettiRAF) cancelAnimationFrame(confettiRAF);
    confettiTick();
  }

  function confettiTick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var alive = false;
    for(var i=0;i<confettiPieces.length;i++){
      var p = confettiPieces[i];
      if(p.life > p.maxLife) continue;
      alive = true;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    }
    if(alive){
      confettiRAF = requestAnimationFrame(confettiTick);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

  /* cleanup mic when leaving spread, restart when reopening if desired */
  backBtn.addEventListener('click', function(){
    // keep mic running (cheap) but stop fallback state
    stopFallback();
  });

})();
</script>
